<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alejandro Estevez</title>
<meta name="theme-color" content="#f3f2ee">
<meta name="description" content="Photographer and brand and cultural strategist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2ee; --ink:#0b0b0b; --mute:#7a7973; --ph:#dcdbd6; --line:rgba(11,11,11,.14);
  --f:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;
  --gut:clamp(14px,1.9vw,28px); --hh:56px; --ease:cubic-bezier(.22,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 24px);scroll-padding-bottom:140px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:500;letter-spacing:-.015em;-webkit-font-smoothing:antialiased;color-scheme:light}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:30;height:var(--hh);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--gut);background:none;color:#fff;mix-blend-mode:difference;font-size:15px}
header{transition:transform .35s cubic-bezier(.22,.8,.2,1),background-color .25s ease}
header.hide{transform:translateY(-100%)}
body:not(.is-home) header{mix-blend-mode:normal;color:var(--ink)}
body:not(.is-home) header.solid{background:var(--bg);box-shadow:0 1px 0 var(--line)}
header .name{justify-self:start;font-weight:600}
header nav{display:flex;gap:28px;align-items:center}
header .right{justify-self:end;display:flex;gap:26px;align-items:center}
header .nav-a,header .contact,header .lang,header .name{position:relative;display:inline-flex;align-items:center;min-height:44px}
header .nav-a[aria-current="page"]{font-weight:600}
.clock{font-variant-numeric:tabular-nums;opacity:.6}
.lang{opacity:.6} .lang b{opacity:1;font-weight:600}
.menu-btn{display:none;min-height:44px;padding:0 2px}
@media(max-width:760px){
  header{grid-template-columns:1fr auto;font-size:13px}
  header nav,header .right .clock,header .right .contact{display:none}
  .menu-btn{display:block}
  header .right{gap:16px}
}
#sheet{position:fixed;inset:var(--hh) 0 auto 0;z-index:29;background:var(--bg);padding:8px var(--gut) 20px;display:none;flex-direction:column;gap:2px;font-size:28px;font-weight:500;border-bottom:1px solid var(--line)}
#sheet.open{display:flex}
#sheet a,#sheet button{padding:10px 0;min-height:44px;text-align:left}
#sheet .c{font-size:13px;color:var(--mute);margin-top:10px}

/* views */
.view{display:none}
.view.on{display:block}

/* home: photo column */
#col{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1vh,12px);overflow:hidden}
.ph{display:block;transform-origin:50% 50%;will-change:transform;cursor:pointer}
.ph .fr{position:relative;width:100%;background:var(--ph) center/cover;overflow:hidden}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease}
.ph img.in,.ph video.in{opacity:1}
.ph .no{position:absolute;left:10px;top:8px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
#cap{transition:opacity .3s ease;position:fixed;left:var(--gut);right:var(--gut);bottom:calc(var(--gut) - 4px);z-index:20;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
#cap .t{font-size:clamp(30px,6.6vw,104px);line-height:.92;letter-spacing:-.045em;font-weight:500;max-width:80vw}
#cap .m{font-size:13px;color:var(--mute);text-align:right;white-space:nowrap;padding-bottom:.5em}
@media(max-width:760px){#cap{flex-direction:column;align-items:flex-start;gap:6px}#cap .m{text-align:left;white-space:normal}#cap .t{font-size:clamp(28px,10vw,52px)}}

/* project */
.proj{padding:calc(var(--hh) + 6vh) var(--gut) 10vh}
.proj .back{font-size:14px;color:var(--mute)}
.proj h1{margin:6vh 0 3vh;font-size:clamp(40px,9vw,150px);line-height:.9;letter-spacing:-.05em;font-weight:500}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:var(--gut);padding:clamp(18px,2.4vw,32px) 0 clamp(28px,4vw,56px);border-top:1px solid var(--line);font-size:clamp(17px,1.6vw,24px);letter-spacing:-.02em;line-height:1.15}
.meta small{display:block;color:var(--mute);font-size:12px;margin-bottom:10px;font-weight:400;letter-spacing:0}
@media(max-width:760px){.meta{grid-template-columns:1fr 1fr;font-size:16px}}
.imgs{display:flex;flex-direction:column;gap:var(--gut);margin:var(--gut) 0}
.imgs{align-items:center}
.imgs .fr{position:relative;width:min(100%,calc(92vh * var(--r)));background:var(--ph) center/cover;overflow:hidden}
.imgs img,.imgs video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.imgs img.in,.imgs video.in{opacity:1}
.txt{max-width:44ch;margin:8vh 0 8vh auto;font-size:clamp(17px,1.5vw,22px);line-height:1.3;letter-spacing:-.02em}
@media(max-width:760px){.txt{margin-left:0}}
.next{display:block;border-top:1px solid var(--line);padding-top:14px;font-size:14px;color:var(--mute)}
.next b{display:block;color:var(--ink);font-weight:500;font-size:clamp(30px,6vw,90px);letter-spacing:-.045em;line-height:1;margin-top:10px}

/* about / contact */
.page{padding:calc(var(--hh) + 10vh) var(--gut) 12vh}
.about-lead{margin:0;max-width:20em;font-size:clamp(30px,5.2vw,84px);line-height:.98;letter-spacing:-.045em;font-weight:500}
.about-bio{margin:0;max-width:30em;font-size:clamp(22px,2.6vw,40px);line-height:1.18;letter-spacing:-.03em;font-weight:500}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut);margin-top:12vh}
.cols .l{grid-column:1/5;font-size:13px;color:var(--mute)}
.cols .r{grid-column:5/13;max-width:46ch;font-size:clamp(16px,1.3vw,20px);line-height:1.32;letter-spacing:-.015em}
.cols .r p{margin:0 0 1.1em}
.brands{list-style:none;padding:0;margin:0;columns:2;font-size:clamp(22px,2.6vw,40px);letter-spacing:-.035em;line-height:1.25}
@media(max-width:760px){.cols .l,.cols .r{grid-column:1/13}.cols{margin-top:8vh;row-gap:10px}}
.ct a{display:block;font-size:clamp(30px,7vw,110px);letter-spacing:-.05em;line-height:1;padding:.12em 0;border-bottom:1px solid var(--line)}
.ct a:hover,.ct a:focus-visible{opacity:.45}
.ct .dis{display:block;font-size:clamp(30px,7vw,110px);letter-spacing:-.05em;line-height:1;padding:.12em 0;border-bottom:1px solid var(--line);color:var(--mute)}
.ct small{display:block;font-size:13px;color:var(--mute);margin:3vh 0 8px;font-weight:400}

/* all-projects link on home */
.all{display:block;width:100%;padding:12vh var(--gut) 10vh;text-align:left}
.all small{display:block;font-size:13px;color:var(--mute);font-weight:400;margin-bottom:10px}
.all b{display:block;font-weight:500;font-size:clamp(34px,8vw,130px);letter-spacing:-.05em;line-height:.95}
.all:hover b,.all:focus-visible b{opacity:.5}

/* work index */
.idx{padding:calc(var(--hh) + 8vh) var(--gut) 10vh}
.idx h1{margin:0 0 5vh;font-size:clamp(40px,9vw,150px);line-height:.9;letter-spacing:-.05em;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:3vh;font-size:15px}
.filters button{min-height:44px;color:var(--mute);position:relative}
.filters button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.filters button sup{font-size:.62em;margin-left:3px;font-weight:400;font-variant-numeric:tabular-nums}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.rows li[hidden]{display:none}
.rows a{display:grid;grid-template-columns:3.5rem 1fr 1fr 1fr 4rem;gap:var(--gut);align-items:baseline;padding:clamp(12px,1.6vw,22px) 0;transition:opacity .2s ease}
.rows a .n{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.rows a .tt{font-size:clamp(22px,3.4vw,54px);letter-spacing:-.04em;line-height:1}
.rows a .cl,.rows a .ct2,.rows a .yr{font-size:14px;color:var(--mute)}
.rows a .yr{text-align:right}
.rows.hov a{opacity:.35}
.rows.hov a:hover,.rows.hov a:focus-visible{opacity:1}
.th{display:none}
.empty{padding:6vh 0;font-size:clamp(22px,3.4vw,54px);letter-spacing:-.04em;color:var(--mute)}
@media(max-width:760px){
  .rows a{grid-template-columns:2.4rem 1fr auto;row-gap:2px}
  .rows a .tt{grid-column:2/3;font-size:26px}
  .rows a .cl{grid-column:2/3}
  .rows a .ct2{grid-column:2/3}
  .rows a .yr{grid-column:3/4;grid-row:1/2}
  .th{display:block;grid-column:3/4;grid-row:2/4;width:64px;background:var(--ph);justify-self:end}
}
#pv{position:fixed;left:0;top:0;z-index:25;width:min(24vw,340px);pointer-events:none;opacity:0;transition:opacity .2s ease;background:var(--ph);overflow:hidden}
#pv.on{opacity:1}
#pv img{display:block;width:100%;height:100%;object-fit:cover}
@media(pointer:coarse){#pv{display:none}}
footer{position:relative;z-index:21;background:var(--bg);padding:var(--gut);display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
footer a:hover{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>

function buildHome(){

var phs=[], cur=-1, ticking=false;
var tops=[],hs=[];
function layout(){ /* medir posiciones sin transform */
  var W=window.innerWidth,H=window.innerHeight,hc=(W<760?.5:.66)*H;
  phs.forEach(function(el,i){var r=HOME[i].ratio,w=Math.min(hc*r,W*(W<760?.8:.66));el.style.width=w+'px';el.style.transform=''});
  if(phs.length){var vh=window.innerHeight,col=$('#col');col.style.paddingTop=Math.max(0,vh/2-phs[0].offsetHeight/2)+'px';col.style.paddingBottom='0px';}
  tops=phs.map(function(el){return el.offsetTop}); hs=phs.map(function(el){return el.offsetHeight});
  tick();
}
function tick(){
  if(!$('#v-home').classList.contains('on')) return;
  var vh=window.innerHeight, mid=window.scrollY+vh/2, best=-1, bd=1e9;
  for(var i=0;i<phs.length;i++){
    var c=tops[i]+hs[i]/2, d=Math.abs(c-mid), t=Math.min(1,d/(vh*.58));
    var e=(1+Math.cos(Math.PI*t))/2; /* 1 al centro, baja suave hacia las orillas */
    var s=reduce?1:(.44+.56*e);
    phs[i].style.transform='scale('+s.toFixed(4)+')';
    if(d<bd){bd=d;best=i}
  }
  if(best!==cur){cur=best;setCaption(best)}
  var f=$('#foot').getBoundingClientRect().top, al=$('#all'), a=al?al.getBoundingClientRect().top:9e9; $('#cap').style.opacity=(f<vh-8||a<vh*.9)?'0':'1';
}
function setCaption(i){

}
var lastY=0,hdr=document.querySelector('header');

  document.querySelectorAll('#rows li').forEach(function(li){
    li.hidden=!(filt==='all'||li.dataset.c.split(' ').indexOf(filt)>-1);
  });
  var e=document.getElementById('empty'); if(e) e.hidden=!!document.querySelector('#rows li:not([hidden])');
  document.querySelectorAll('.filters button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.f===filt)});
}
document.addEventListener('click',function(e){var b=e.target.closest('.filters button');if(b){filt=b.dataset.f;applyFilter()}});
/* vista previa flotante al pasar el cursor (solo mouse/trackpad) */
var pv=document.getElementById('pv');
function showPv(id,x,y){
  var p=PROJECTS.find(function(q){return q.id===id}); if(!p) return;
  var w=Math.min(window.innerWidth*.24,340); pv.style.width=w+'px'; pv.style.height=(w/p.ratio)+'px';
  pv.style.background='var(--ph) url('+p.q+') center/cover';pv.innerHTML='<img alt="" src="'+src(p.k,960)+'">'; pv.classList.add('on'); movePv(x,y,w,w/p.ratio);
}
function movePv(x,y,w,h){
  w=w||pv.offsetWidth; h=h||pv.offsetHeight;
  var px=Math.min(window.innerWidth-w-16,x+28), py=Math.max(70,Math.min(window.innerHeight-h-16,y-h/2));
  pv.style.transform='translate('+px+'px,'+py+'px)';
}
document.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;var a=e.target.closest&&e.target.closest('#rows a');var rw=$('#rows');
  if(a){if(rw)rw.classList.add('hov');showPv(a.dataset.id,e.clientX,e.clientY)}else{pv.classList.remove('on');if(rw)rw.classList.remove('hov')}});
document.addEventListener('focusin',function(e){var a=e.target.closest&&e.target.closest('#rows a');if(a){var r=a.getBoundingClientRect();$('#rows').classList.add('hov');showPv(a.dataset.id,window.innerWidth*.5,r.top+r.height/2)}});
document.addEventListener('focusout',function(){pv.classList.remove('on');var rw=$('#rows');if(rw)rw.classList.remove('hov')});

function buildProject(id){
  var i=PROJECTS.findIndex(function(p){return p.slug===id||p.id===id}); if(i<0){location.hash='#/';return}
  var p=PROJECTS[i], n=PROJECTS[(i+1)%PROJECTS.length], t=T[lang];
  var imgs='';
  p.media.forEach(function(m,ix){imgs+=frame({ratio:m.r,k:m.k,q:m.q},p.title[lang],'(max-width:760px) 100vw, 70vw',ix<2).replace('class="fr" style="','class="fr" style="--r:'+m.r+';')});
  $('#v-proj').innerHTML='<div class="proj"><a class="back" href="#/work">'+t.back+'</a><h1>'+esc(p.title[lang])+'</h1>'+
   '<div class="meta"><div><small>'+t.cats+'</small>'+esc(catNames(p).join(', '))+'</div><div><small>'+t.client+'</small>'+esc(p.brand||t.none)+'</div></div>'+
   '<div class="imgs">'+imgs+'</div>'+(p.text[lang]?'<p class="txt">'+esc(p.text[lang])+'</p>':'')+
   '<a class="next" href="#/work/'+n.slug+'">'+t.next+'<b>'+esc(n.title[lang])+'</b></a></div>';
}
function buildAbout(){
  var t=T[lang], b='';
  if(CONFIG.showBrands){b='<div class="cols"><div class="l">'+t.aboutL3+'</div><div class="r"><ul class="brands">'+BRANDS.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div></div>'}
  $('#v-about').innerHTML='<div class="page"><p class="about-bio">'+t.aboutBio+'</p>'+b+'</div>';
}
function buildContact(){
  var t=T[lang];
  var m=CONFIG.email?'<a href="mailto:'+esc(CONFIG.email)+'">'+esc(CONFIG.email)+'</a>':'<span class="dis">'+t.pending+'</span>';
  var wa=CONFIG.whatsapp?'<a href="https://wa.me/'+esc(CONFIG.whatsapp.replace(/\D/g,''))+'" target="_blank" rel="noopener">'+esc(CONFIG.whatsapp)+' ↗</a>':'<span class="dis">'+t.pending+'</span>';
  var ig=CONFIG.instagram?'<a href="'+esc(CONFIG.instagram)+'" target="_blank" rel="noopener">@estuvez ↗</a>':'<span class="dis">'+t.pending+'</span>';
  $('#v-contact').innerHTML='<div class="page ct"><h1 class="about-lead">'+t.contactTitle+'</h1><small>'+t.contactMail+'</small>'+m+'<small>'+t.contactWa+'</small>'+wa+'<small>'+t.contactIg+'</small>'+ig+'</div>';
}
function buildFoot(){
  var t=T[lang];
  $('#foot').innerHTML='<span>© '+new Date().getFullYear()+' Alejandro Estevez</span>'+(CONFIG.libelulaUrl?'<a href="'+esc(CONFIG.libelulaUrl)+'">Dominio Común ↗</a>':'<span>Dominio Común</span>');
}

function route(){
  var h=location.hash.replace(/^#\/?/,''), parts=h.split('/'), r=parts[0]||'home';
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on')});
  document.querySelectorAll('.nav-a,.contact').forEach(function(a){a.removeAttribute('aria-current')});
  $('#sheet').classList.remove('open'); $('#menu').setAttribute('aria-expanded','false');
  var key='home'; pv.classList.remove('on'); document.body.classList.toggle('is-home',r==='home'||r===''); hdr&&hdr.classList.remove('hide'); lastY=0;
  if(r==='work'&&parts[1]){buildProject(parts[1]);$('#v-proj').classList.add('on');key='work';window.scrollTo(0,0)}
  else if(r==='work'){buildWork();$('#v-work').classList.add('on');key='work';window.scrollTo(0,0)}
  else if(r==='about'){buildAbout();$('#v-about').classList.add('on');key='about';window.scrollTo(0,0)}
  else if(r==='contact'){buildContact();$('#v-contact').classList.add('on');key='contact';window.scrollTo(0,0)}
  else{$('#v-home').classList.add('on');$('#cap').style.display='';cur=-1;layout();key='home'}
  $('#cap').style.display=(r==='about'||r==='contact'||r==='work')?'none':'';
  var a=document.querySelector('[data-r="'+key+'"]'); if(a&&r!=='')a.setAttribute('aria-current','page');
  document.body.style.overflow='';
}
function applyLang(){
  var t=T[lang];
  document.documentElement.lang=lang;
  $('#lang').innerHTML=lang==='es'?'<b>ES</b> / EN':'ES / <b>EN</b>';
  $('#menu').textContent=t.menu;
  [['n-work','navWork'],['n-about','navAbout'],['n-contact','navContact'],['s-sel','navSel'],['s-work','navWork'],['s-about','navAbout'],['s-contact','navContact']].forEach(function(x){var el=document.getElementById(x[0]);if(el)el.textContent=t[x[1]]});
  document.title='Alejandro Estevez — '+t.role.replace(/\.$/,'');
  buildHome(); buildFoot(); route(); clock();
}
function clock(){
  try{
    var s=new Date().toLocaleTimeString(lang==='es'?'es-MX':'en-GB',{timeZone:CONFIG.tz,hour:'2-digit',minute:'2-digit',hour12:false});
    $('#clock').textContent=s+' '+CONFIG.city; $('#clock2').textContent=s+' '+CONFIG.city;
  }catch(e){}
}
$('#lang').addEventListener('click',function(){lang=lang==='es'?'en':'es';localStorageSet('lang',lang);applyLang()});
$('#menu').addEventListener('click',function(){var o=$('#sheet').classList.toggle('open');this.setAttribute('aria-expanded',o)});
window.addEventListener('hashchange',route);
setInterval(clock,15000);
applyLang();
window.addEventListener('load',function(){layout();setTimeout(function(){PROJECTS.forEach(function(p){var i=new Image();i.src=p.src})},800)});
</script>
</body>
</html>
