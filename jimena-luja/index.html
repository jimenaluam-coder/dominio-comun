<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jimena Luja</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Jimena Luja — creative director. Direction, post-production, VFX and generative media.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;700&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --ink:#f2f2f0; --mute:#8a8a86; --ph:#141414; --line:rgba(242,242,240,.14);
  --f:'Geist','Helvetica Neue',Helvetica,Arial,sans-serif; --m:'Geist Mono',ui-monospace,monospace;
  --gut:clamp(14px,1.9vw,28px); --hh:56px; --pad:clamp(20px,4.5vw,64px); --tgap:clamp(28px,6vh,64px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:300;-webkit-font-smoothing:antialiased;color-scheme:dark;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:400}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:30;height:var(--hh);display:flex;align-items:center;justify-content:space-between;padding:0 var(--gut);font-size:13px;transition:transform .35s cubic-bezier(.22,.8,.2,1),background-color .25s}
header.hide{transform:translateY(-100%)}
header.solid{background:rgba(0,0,0,.92);box-shadow:0 1px 0 var(--line)}
header .name{font-weight:400;min-height:44px;display:inline-flex;align-items:center}
header nav{display:flex;gap:26px;align-items:center}
header nav a,header nav button{min-height:44px;display:inline-flex;align-items:center;color:var(--mute);transition:color .2s}
header nav a:hover,header nav a[aria-current="page"],header nav button:hover{color:var(--ink)}
.lang b{color:var(--ink);font-weight:400}
.menu-btn{display:none}
@media(max-width:760px){header nav .nl{display:none}.menu-btn{display:inline-flex}}
#sheet{position:fixed;inset:var(--hh) 0 auto 0;z-index:29;background:#000;padding:8px var(--gut) 22px;display:none;flex-direction:column;font-size:30px;border-bottom:1px solid var(--line)}
#sheet.open{display:flex}
#sheet a{padding:8px 0;min-height:44px}
.view{display:none}.view.on{display:block}

/* hero (negro) */
.hero{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:0 var(--gut);position:relative;background:#000;transition:opacity .4s}
.does{margin:0;display:flex;justify-content:center;gap:.27em;font-weight:300;font-size:clamp(22px,3.1vw,46px);letter-spacing:-.015em;line-height:1.15;white-space:nowrap}
.does #lead{text-align:right;flex:none}
.does .w{text-align:left;flex:none;cursor:pointer}
.does .w .x{color:var(--mute)}
@media(max-width:760px){.does{flex-direction:column;align-items:center;gap:.1em}.does #lead,.does .w{text-align:center;min-width:0!important}}
.hint{position:absolute;left:50%;bottom:var(--gut);transform:translateX(-50%);min-height:44px;padding:0 12px;color:var(--mute);transition:color .2s}
.hint:hover{color:var(--ink)}

/* carrusel de destacados (lupa) */
#col{display:flex;flex-direction:column;align-items:center;gap:clamp(28px,9vh,110px);overflow:hidden;padding:6vh 0 34vh}
.mv{display:block;position:relative;transform-origin:50% 50%;will-change:transform}
.mv .fr{position:relative;width:100%;aspect-ratio:var(--ar);background:var(--ph) center/cover;overflow:hidden}
.mv[data-crop] .fr{background-size:calc(var(--c) * 100%)}
.mv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;opacity:0;transition:opacity .6s;transform:scale(var(--crop,1.025))}
.mv iframe.in{opacity:1}
#cap{position:fixed;left:var(--gut);bottom:var(--gut);z-index:20;pointer-events:none;display:block;opacity:0;transition:opacity .3s;mix-blend-mode:difference}
#cap.on{opacity:1}
#cap .t{font-size:13px;line-height:1.3;letter-spacing:.16em;text-transform:uppercase;font-weight:500;max-width:60vw}
#cap .m{color:var(--mute);line-height:1.3;margin-top:4px}

.all{display:flex;justify-content:space-between;align-items:baseline;margin:0 var(--gut) 10vh;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.all small{color:var(--mute)}
.all b{font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;transition:opacity .2s}
.all:hover b{opacity:.5}

/* índice de proyectos (estilo Obys) */
.wk{position:relative;padding:calc(var(--hh) + 4vh) var(--gut) 20vh}
.wk-top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;font-size:13px;margin-bottom:5vh}
.wk-top h1{margin:0;font-size:13px;font-weight:400}
.wk-top .n{color:var(--mute)}
.filters{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:13px;margin-left:-2px}
.filters button{min-height:32px;color:var(--mute);transition:color .2s}
.filters button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.filters sup{font-size:.75em;margin-left:2px}
.wk-r{display:flex;gap:28px;align-items:baseline;flex:none}
.views{display:flex;gap:0;font-size:13px;color:var(--mute)}
.views button{color:var(--mute)}.views button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
/* vista vertical: lista | imágenes | datos */
.wv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:var(--gut);align-items:start}
.wv-list{position:sticky;top:calc(50vh - 120px);margin:0;padding:0;list-style:none;font-size:13px;line-height:1.5}
.wv-list a{color:#5a5a57;transition:color .2s}
.wv-list a:hover,.wv-list a.on{color:var(--ink)}
.wv-list li[hidden]{display:none}
.wv-col{display:flex;flex-direction:column;align-items:center;gap:clamp(28px,8vh,96px);padding:30vh 0}
.wv-col a{display:block;max-width:100%;width:min(100%,calc(56vh * var(--ar)));aspect-ratio:var(--ar);flex:none;background:var(--ph) center/cover;transform-origin:50% 50%;will-change:transform;opacity:.35;transition:opacity .4s}
.wv-col a.on{opacity:1}
.wv-col a[hidden]{display:none}
.wv-meta{position:sticky;top:calc(50vh - 30px);font-size:13px;line-height:1.5}
.wv-meta .m{color:var(--mute)}
/* vista cuadrícula */
.wg{columns:4 240px;column-gap:var(--gut)}
.wg a{display:block;break-inside:avoid;margin:0 0 calc(var(--gut) * 1.6)}
.wg a[hidden]{display:none}
.wg .im{display:block;width:100%;aspect-ratio:var(--ar);background:var(--ph) center/cover;transition:opacity .3s}
.wg a:hover .im{opacity:.7}
.wg .t{display:block;margin-top:8px;font-size:13px}
.wg .c{display:block;font-size:13px;color:var(--mute)}
@media(max-width:860px){.wv{grid-template-columns:1fr}.wv-list,.wv-meta{display:none}.wv-col{padding:4vh 0}.wv-col a{opacity:1}}

/* ===== página de proyecto (estructura MÚSCULO) ===== */
.pj{padding:0 var(--pad) 70px}
.media{position:relative;background:#000}
.frame{background:#000 center/cover}
.frame iframe,.frame img,.seqframe iframe,.seqframe img{width:100%;height:100%;border:0;display:block;object-fit:cover;pointer-events:none}
.frame,.seqframe{overflow:hidden}
.frame iframe,.seqframe iframe{transform:scale(var(--crop,1.025));transform-origin:50% 50%}
/* horizontal: video a pantalla completa, columnas debajo */
.stage.land{margin-inline:calc(-1 * var(--pad));display:flex;flex-direction:column}
.stage.land .media{display:flex;justify-content:center;background:#000;padding-top:var(--hh)}
.stage.land .frame{position:relative;width:min(100%,calc((100svh - var(--hh)) * var(--ar)));aspect-ratio:var(--ar)}
.stage.land .pwrap .vbar{left:50%;right:auto;transform:translateX(-50%);width:min(100%,calc((100svh - var(--hh)) * var(--ar)))}
.stage.land .cols{padding-inline:var(--pad)}
.cols{display:grid;grid-template-columns:1.1fr .9fr .9fr;gap:clamp(18px,3vw,44px);margin-block:var(--tgap)}
.col p{margin:0;font-size:11px;line-height:1.6;max-width:34ch}
.credits .pt{font-weight:700;font-size:15px;letter-spacing:.34em;text-transform:uppercase;line-height:1.35;margin:0 0 14px}
.credits .row{display:flex;gap:14px;margin:0;font-size:11px;line-height:1.6}
.credits .lbl{font-weight:700;min-width:46px;flex:0 0 auto}
/* vertical: ficha | video | reseña */
.stage.vert{margin-inline:calc(-1 * var(--pad));display:grid;grid-template-columns:1fr auto;grid-template-areas:"info video";position:relative;background:#000;padding-top:var(--hh)}
.stage.vert .media{grid-area:video;justify-self:end;width:calc(92vh * var(--ar));max-width:78vw;aspect-ratio:var(--ar)}
.stage.vert .frame{position:absolute;inset:0}
.stage.vert .cols{grid-area:info;display:flex;flex-direction:column;justify-content:center;padding:24px clamp(26px,4vw,56px) 24px var(--pad);margin:0}
.stage.vert .spacer{display:none}
.stage.vert .credits{order:-1;border-bottom:1px solid #fff}
.stage.vert .credits .pt{margin-bottom:22px}
.stage.vert .credits .row{justify-content:space-between;gap:18px;border-top:1px solid rgba(255,255,255,.55);padding:8px 0;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.stage.vert .credits .row span:last-child{text-align:right}
.stage.vert .col:not(.credits){margin-top:36px}
.stage.vert .col:not(.credits) p{font-size:10px;line-height:1.65}
.rotmeta{position:absolute;right:calc(92vh * var(--ar) + 12px);bottom:6px;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:9px;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap;margin:0}
@media (min-aspect-ratio:6/5) and (min-width:681px){
  .stage.vert{grid-template-columns:1fr auto 1fr;grid-template-areas:"info video desc";align-items:center}
  .stage.vert .media{justify-self:center;width:calc((100vh - var(--hh)) * var(--ar));max-width:60vw}
  .rotmeta{right:calc(50% + 50vh * var(--ar) + 14px)}
  .stage.vert .cols{display:contents}
  .stage.vert .credits{grid-area:info;align-self:center;width:clamp(240px,24vw,440px);margin-left:var(--pad)}
  .stage.vert .col:not(.credits){grid-area:desc;align-self:center;margin:0 var(--pad) 0 clamp(26px,3vw,60px);max-width:36ch}
}
/* barra de video */
.vbar{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;gap:clamp(14px,2vw,26px);padding:16px clamp(16px,3vw,36px);opacity:0;transition:opacity .5s;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.pwrap:hover .vbar,.pwrap.fsx .vbar,.pwrap:focus-within .vbar{opacity:1}
.vbar button{font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.85;white-space:nowrap;min-height:32px}
.vbar button:hover{opacity:1}
.track{flex:1;height:14px;display:flex;align-items:center;cursor:pointer;position:relative}
.track:before{content:"";position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.35)}
.fill{position:relative;height:2px;background:#fff;width:0%;transition:width .15s linear}
.pwrap.fsx{position:fixed!important;inset:0;z-index:500;background:#000;display:flex;align-items:center;justify-content:center;margin:0!important;width:auto!important;height:auto!important;max-width:none!important;aspect-ratio:auto!important}
.pwrap.fsx .frame,.pwrap.fsx .seqframe{position:relative!important;top:auto!important;left:auto!important;transform:none!important;inset:auto!important;width:min(100vw,calc(100dvh * var(--ar)))!important;aspect-ratio:var(--ar)}
body.fslock{overflow:hidden}
/* secuencia: videos e imágenes extra */
.seqitem{position:relative}
.seqitem.boxed{width:fit-content;max-width:100%;margin:clamp(8px,1.1vw,18px) auto}
.seqitem.boxed .seqframe{position:relative;width:calc(78svh * var(--ar));max-width:88vw;aspect-ratio:var(--ar);background:#000 center/cover}
.seqlbl{margin:10px 0 0;color:var(--mute)}
.seqgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1.1vw,18px);padding:clamp(8px,1.1vw,18px) 0;align-items:start}
.gitem{margin:0;position:relative;overflow:hidden;background:var(--ph);aspect-ratio:var(--ar)}
.gitem img{width:100%;height:100%;object-fit:cover;display:block}
.gitem.wide{grid-column:1/-1}
.gitem.sola{grid-column:1/-1;width:calc(50% - clamp(4px,.55vw,9px));margin-inline:auto}
/* texto largo */
.statement{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(14px,1.6vw,28px);padding:clamp(72px,9vw,150px) 0 clamp(64px,8vw,130px)}
.st-label{grid-column:1/4;display:flex;flex-direction:column;gap:6px;padding-top:.55em;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.st-label .st-sub{font-weight:400;color:var(--mute);letter-spacing:.14em}
.st-lead{grid-column:4/12;margin:0;font-size:clamp(22px,2.35vw,38px);line-height:1.16;letter-spacing:-.012em;max-width:30em}
.st-body{grid-column:7/12;margin-top:clamp(40px,4.5vw,72px);padding-top:20px;border-top:1px solid #fff;font-size:clamp(14px,1.1vw,17px);line-height:1.55;max-width:48ch}
.st-body p{margin:0}
/* pie de proyecto */
.brandline{display:flex;align-items:flex-start;gap:clamp(24px,4vw,60px);margin-top:var(--tgap)}
.brand{font-weight:500;font-size:15px;letter-spacing:.34em;text-transform:uppercase;line-height:1.35}
.made{font-weight:700;font-size:10px;line-height:1.5;padding-top:4px;margin:0}
.locations{margin-top:var(--tgap)}
.lh{font-weight:700;margin:0 0 12px;font-size:11px}
.locations ul{list-style:none;margin:0;padding:0;columns:2;column-gap:clamp(40px,8vw,120px);max-width:420px}
.locations li{font-size:11px;line-height:1.7;break-inside:avoid}
.locations a:hover{text-decoration:underline}
.cur{font-weight:700}
.foot{margin-block:var(--tgap)}
.back{font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#8a8a86;transition:color .2s}
.back:hover{color:#fff}
@media (max-width:680px),(max-aspect-ratio:1/1){
  .stage.vert{grid-template-columns:1fr;grid-template-areas:"video" "info"}
  .stage.vert .media{justify-self:stretch;width:100%;max-width:none}
  .stage.vert .cols{padding:var(--tgap) var(--pad);margin-block:0}
  .stage.vert .col:not(.credits){margin-top:24px}
  .rotmeta{display:none}
  .stage.land .media{height:auto;overflow:visible}
  .stage.land .frame{position:relative;top:auto;left:auto;transform:none;width:100%}
  .seqitem.boxed .seqframe{width:100%;max-width:none}
  .seqitem.boxed{width:auto;margin-inline:calc(-1 * var(--pad))}
  .seqgrid{gap:6px;padding:6px 0}
  .seqgrid .gitem.sola{width:100%}
  .cols{grid-template-columns:1fr}
  .spacer{display:none}
  .brandline{flex-direction:column;gap:14px}
}
@media(max-width:680px){.statement{display:block;padding:56px 0 48px}.st-label{margin-bottom:22px}.st-lead{font-size:21px;line-height:1.22}.st-body{margin-top:32px;font-size:15px}}

/* ===== película (estilo Obys: panel fijo + imagen) ===== */
.fm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100svh}
.fm-side{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;justify-content:center;padding:var(--hh) var(--gut) var(--gut);font-size:13px;line-height:1.5}
.fm-side h1{margin:0 0 6px;font-size:13px;font-weight:400}
.fm-side .k{color:var(--mute);margin:0 0 4vh}
.fm-dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 22px;max-width:420px}
.fm-dl dt{color:var(--mute)}.fm-dl dd{margin:0}
.fm-back{position:absolute;left:var(--gut);bottom:var(--gut);color:var(--mute)}
.fm-back:hover{color:var(--ink)}
.fm-main{padding:calc(var(--hh) + 4vh) var(--gut) 8vh;display:flex;flex-direction:column;gap:var(--gut);align-items:center}
.fm-poster{width:min(100%,calc(84svh * var(--ar)));aspect-ratio:var(--ar);background:#0d0d0d center/cover}
.fm-mini{width:96px;aspect-ratio:var(--ar);background:#0d0d0d center/cover;margin:0 0 4vh}
.fm.has-v{grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr)}
.fm.has-v .fm-main{min-height:100svh;justify-content:center;padding-top:var(--hh)}
.fm-main .seqitem.boxed{margin:0;width:100%}
.fm-main .seqitem.boxed .seqframe{width:100%;max-width:none}
.fm-more{padding:8vh var(--gut) 4vh;border-top:1px solid var(--line);font-size:13px}
.fm-more p{margin:0 0 18px;color:var(--mute)}
.fm-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gut);align-items:end}
.fm-row a{display:block}
.fm-row .im{display:block;width:100%;aspect-ratio:var(--ar);background:#0d0d0d center/cover;transition:opacity .3s}
.fm-row a:hover .im{opacity:.7}
.fm-row .t{display:block;margin-top:8px}
@media(max-width:860px){.fm{grid-template-columns:1fr}.fm-side{position:static;height:auto;padding-top:calc(var(--hh) + 4vh)}.fm-back{position:static;margin-top:4vh;display:inline-block}.fm-row{grid-template-columns:repeat(2,1fr)}}

/* about (estilo Obys) */
.ab{padding:calc(var(--hh) + 6vh) var(--gut) 0}
.ab-lead{margin:0;max-width:22em;font-size:clamp(24px,2.7vw,42px);line-height:1.18;letter-spacing:-.015em;font-weight:400}
.ab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:var(--gut);margin-top:14vh;font-size:13px;line-height:1.5}
.ab-grid p{margin:0 0 1.2em;max-width:34em}
.ab-blk{margin:0 0 4.5vh}
.ab-blk .l{display:block;color:var(--mute)}
.ab-blk ul{list-style:none;margin:0;padding:0}
.ab-blk a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(242,242,240,.35)}
.ab-blk a:hover{text-decoration-color:var(--ink)}
.ab-word{margin:14vh 0 0;font-size:19.4vw;line-height:.8;letter-spacing:-.055em;font-weight:400;white-space:nowrap;overflow:hidden;transform:translateY(.08em)}
@media(max-width:860px){.ab-grid{grid-template-columns:1fr}}
/* aparición de líneas */
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s cubic-bezier(.22,.8,.2,1),transform .9s cubic-bezier(.22,.8,.2,1)}
.rv.in{opacity:1;transform:none}
footer{display:flex;justify-content:space-between;padding:var(--gut);color:var(--mute)}
footer a:hover{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>

<body>
<a class="sr" href="#main">Skip</a>
<header>
  <a class="name" href="#/">Jimena Luja</a>
  <nav aria-label="Principal">
    <a class="nl" href="#/work" data-r="work" id="n-work">Work</a>
    <a class="nl" href="#/about" data-r="about" id="n-about">About</a>
    <span class="nl clock" id="clock" style="color:var(--mute)"></span>
    <button class="lang" id="lang" aria-label="Idioma / Language"></button>
    <button class="menu-btn" id="menu" aria-expanded="false" aria-controls="sheet">Menu</button>
  </nav>
</header>
<div id="sheet"><a href="#/work" id="s-work">Work</a><a href="#/about" id="s-about">About</a></div>

<main id="main">
  <section class="view" id="v-home">
    <div class="hero">
      <h1 class="does"><span id="lead">Jimena Luja does</span><span class="w" id="word" aria-live="off"></span></h1>
      <button class="hint cap" id="hint" type="button">Scroll ↓</button>
    </div>
    <div id="col"></div>
    <a class="all" id="work-anchor" href="#/work"><small class="cap" id="all-s"></small><b id="all-b"></b></a>
  </section>

function buildWork(){var t=T[lang],L=lang==='es'?{sel:'Proyectos seleccionados',v:'Vertical',g:'Cuadrícula'}:{sel:'Selected works',v:'Vertical',g:'Grid'};

  var fb=[['all',t.filterAll]].concat(CAT_ORDER.map(function(c){return [c,CATS[c][lang]]})).map(function(f){return '<button data-f="'+f[0]+'" aria-pressed="'+(filt===f[0])+'">'+esc(f[1])+'<sup>'+cnt(f[0])+'</sup></button>'}).join('');
  var list=PROJECTS.map(function(p,k){return '<li data-c="'+p.cat+'"><a href="#/work/'+p.slug+'" data-k="'+k+'">'+esc(p.title)+'</a></li>'}).join('');
  var col=PROJECTS.map(function(p,k){var im=thumb(p);return '<a href="#/work/'+p.slug+'" data-k="'+k+'" data-c="'+p.cat+'" style="position:relative;overflow:hidden;--ar:'+tar(p)+';'+bg(im)+'" aria-label="'+esc(p.title)+'">'+liveIf(p)+'</a>'}).join('');
  var grid=PROJECTS.map(function(p){var im=thumb(p);return '<a href="#/work/'+p.slug+'" data-c="'+p.cat+'"><span class="im" style="position:relative;overflow:hidden;--ar:'+tar(p)+';'+bg(im)+'">'+liveIf(p)+'</span><span class="t">'+esc(p.title)+'</span><span class="c">'+esc(listSub(p))+'</span></a>'}).join('');
  $('#v-work').innerHTML='<div class="wk"><h1 class="sr">'+L.sel+'</h1><div class="wk-top"><div class="filters" role="group" aria-label="'+L.sel+'">'+fb+'</div><div class="wk-r">'+VIEWS+'<span class="n" id="wkN"></span></div></div>'+
    (view==='v'?'<div class="wv"><ul class="wv-list">'+list+'</ul><div class="wv-col" id="wvCol">'+col+'</div><div class="wv-meta" id="wvMeta"></div></div>':'<div class="wg">'+grid+'</div>')+
    '</div>';

function applyFilt(){var n=0;document.querySelectorAll('#v-work [data-c]').forEach(function(a){var on=filt==='all'||a.dataset.c===filt;a.hidden=!on;if(on&&a.parentNode.classList.contains('wv-col'))n++});
  document.querySelectorAll('.filters button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.f===filt)});
  var c=filt==='all'?PROJECTS.length:PROJECTS.filter(function(p){return p.cat===filt}).length;var nEl=$('#wkN');if(nEl)nEl.textContent=String(c).padStart(2,'0');
  wvItems=[].slice.call(document.querySelectorAll('#wvCol a')).filter(function(a){return !a.hidden});wvCur=-1;sizeWork();tickWork()}
function sizeWork(){var c=$('#wvCol');if(!c||!c.clientWidth)return;var W=c.clientWidth,H=innerHeight,base=Math.min(W*.9,H*.5*1.7778);
  document.querySelectorAll('#wvCol a').forEach(function(a){var p=PROJECTS[+a.dataset.k];a.style.width=eqW(tar(p),base,W,H*.62)+'px'})}
function tickWork(){if(!$('#v-work').classList.contains('on')||!wvItems.length)return;var vh=innerHeight,best=-1,bd=1e9;
  wvItems.forEach(function(a,i){var r=a.getBoundingClientRect(),c=r.top+r.height/2,d=Math.abs(c-vh/2),k=Math.min(1,d/(vh*.5)),e=(1+Math.cos(Math.PI*k))/2;
    a.style.transform='scale('+(reduce?1:(.36+.64*e)).toFixed(4)+')';if(d<bd){bd=d;best=i}});
  if(best!==wvCur){wvCur=best;var a=wvItems[best],k=+a.dataset.k,p=PROJECTS[k];
    wvItems.forEach(function(x,i){x.classList.toggle('on',i===best)});
    document.querySelectorAll('.wv-list a').forEach(function(x){x.classList.toggle('on',+x.dataset.k===k)});
    var m=$('#wvMeta');if(m)m.innerHTML='<div>'+esc(p.title)+'</div><div class="m">'+esc(p.role[lang])+'</div><div class="m">'+esc(listSub(p))+(p.year&&p.year!=='—'?' · '+esc(p.year):'')+'</div>'}}

function vbar(){var t=T[lang];return '<div class="vbar"><button class="pp" type="button">'+t.pause+'</button><div class="track"><div class="fill"></div></div><button class="snd" type="button">'+t.sOn+'</button><button class="fs" type="button">'+t.fs+'</button></div>'}
var CROP={'1246400742':1.1,'1209617395':1.05,'1209617397':1.05,'1209617396':1.05};
function vframe(cls,v){return '<div class="'+cls+'" style="'+(CROP[v.id]?'--crop:'+CROP[v.id]+';':'')+bg(v.poster)+'"><iframe src="'+vsrc(v.id,true)+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Video"></iframe></div>'+vbar()}
/* controles por postMessage (sin script externo de Vimeo) */
function vpost(f,method,value){try{f.contentWindow.postMessage(JSON.stringify(value===undefined?{method:method}:{method:method,value:value}),'*')}catch(e){}}
var VW=[];
addEventListener('message',function(e){if(!/vimeo\.com$/.test((function(){try{return new URL(e.origin).hostname}catch(x){return ''}})()))return;
  var d;try{d=typeof e.data==='string'?JSON.parse(e.data):e.data}catch(x){return}if(!d)return;
  for(var i=0;i<VW.length;i++){var w=VW[i];if(w.f.contentWindow!==e.source)continue;
    if(d.event==='ready'){vpost(w.f,'addEventListener','timeupdate');vpost(w.f,'play')}
    if(d.event==='timeupdate'&&d.data){w.dur=d.data.duration;w.fill.style.width=((d.data.percent||0)*100).toFixed(1)+'%'}
    if(d.method==='getDuration')w.dur=+d.value||0;
    if(d.method==='getCurrentTime'&&w.dur)w.fill.style.width=Math.min(100,(+d.value/w.dur)*100).toFixed(1)+'%'}});
setInterval(function(){VW.forEach(function(w){if(!document.body.contains(w.f))return;if(!w.dur)vpost(w.f,'getDuration');vpost(w.f,'getCurrentTime')})},400);
function initPlayers(){var t=T[lang];VW=[];
  document.querySelectorAll('#v-proj .pwrap').forEach(function(w){var f=w.querySelector('iframe');if(!f)return;
    var o={f:f,fill:w.querySelector('.fill'),dur:0,paused:false,muted:true};VW.push(o);
    var pp=w.querySelector('.pp'),snd=w.querySelector('.snd'),fs=w.querySelector('.fs'),track=w.querySelector('.track');
    f.addEventListener('load',function(){vpost(f,'addEventListener','timeupdate')});
    pp.onclick=function(){o.paused=!o.paused;vpost(f,o.paused?'pause':'play');pp.textContent=o.paused?t.play:t.pause};
    snd.onclick=function(){o.muted=!o.muted;vpost(f,'setMuted',o.muted);vpost(f,'setVolume',o.muted?0:1);if(!o.muted&&o.paused){o.paused=false;vpost(f,'play');pp.textContent=t.pause}snd.textContent=o.muted?t.sOn:t.sOff};
    track.onclick=function(e){if(!o.dur)return;var r=track.getBoundingClientRect();vpost(f,'setCurrentTime',o.dur*(e.clientX-r.left)/r.width)};
    fs.onclick=function(){var on=w.classList.toggle('fsx');document.body.classList.toggle('fslock',on)}})}

  var m=p.main,vert=m.ar<1.2,h='',desc=p.desc?'<div class="col"><p>'+esc(p.desc[lang])+'</p></div>':'<div class="col"></div>';

     '<section class="cols"><div class="spacer"></div>'+desc+creditsHTML(p)+'</section>'+

var rvObs=null;
function reveal(){var els=document.querySelectorAll('.view.on .rv:not(.in), #v-proj .rv:not(.in), #v-about .rv:not(.in)');
  if(reduce||!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
  if(!rvObs)rvObs=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){var d=[].indexOf.call(x.target.parentNode.children,x.target);x.target.style.transitionDelay=Math.min(d,6)*70+'ms';x.target.classList.add('in');rvObs.unobserve(x.target)}})},{rootMargin:'0px 0px -8% 0px'});
  els.forEach(function(e){rvObs.observe(e)})}

<script>
/* Flechas vectoriales propias: sustituyen los caracteres ↗ ↓ ← → (iOS y Android los dibujan como emoji) */
(function(){
  var P = {
    '↗': 'M2 10L10 2M4 2h6v6',
    '→': 'M1 6h10M7 2l4 4-4 4',
    '←': 'M11 6H1M5 2L1 6l4 4',
    '↓': 'M6 1v10M2 7l4 4 4-4'
  };
  var RE = /[↗→←↓]️?/g, busy = false;
  function svg(ch){
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 12 12'); s.setAttribute('aria-hidden', 'true'); s.setAttribute('focusable', 'false');
    s.setAttribute('class', 'ar');
    s.style.cssText = 'width:.78em;height:.78em;vertical-align:-.04em;display:inline-block;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:square;stroke-linejoin:miter;overflow:visible';
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', P[ch.charAt(0)]); s.appendChild(p);
    return s;
  }
  function walk(root){
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n, list = [];
    while ((n = w.nextNode())) { var pn = n.parentNode && n.parentNode.nodeName; if (pn !== 'SCRIPT' && pn !== 'STYLE' && pn !== 'TITLE' && RE.test(n.nodeValue)) list.push(n); RE.lastIndex = 0; }
    list.forEach(function(t){
      var txt = t.nodeValue, frag = document.createDocumentFragment(), last = 0, m; RE.lastIndex = 0;
      while ((m = RE.exec(txt))) { frag.appendChild(document.createTextNode(txt.slice(last, m.index))); frag.appendChild(svg(m[0])); last = m.index + m[0].length; }
      frag.appendChild(document.createTextNode(txt.slice(last))); t.parentNode.replaceChild(frag, t);
    });
  }
  function run(){ if (busy) return; busy = true; try { walk(document.body); } finally { busy = false; } }
  run();
  new MutationObserver(function(){ run(); }).observe(document.body, { childList: true, characterData: true, subtree: true });
})();
</script>
